name: Run script bundles every 5 minutes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run script bundles manually
        env:
          MAX_SCRIPTS: "5"
          ENABLE_SCROLL: "true"
          ENABLE_MOUSE: "true"
          ENABLE_REALISTIC_PAGE: "true"
          BROWSER_PROFILE: "windows_chrome"
        run: |
          python visit_links.py
